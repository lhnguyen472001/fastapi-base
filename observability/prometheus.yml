# Prometheus scrape config — pulls metrics emitted by the OTel collector's
# `prometheus` exporter (collector listens on :8889 inside the compose network).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: fastapi-base

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
