services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_base
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_base"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fastapi-base-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP listener (no auth, no TLS)
      - "8025:8025"  # Web UI + JSON HTTP API

volumes:
  postgres_data:
