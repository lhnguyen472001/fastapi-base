services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_base
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_base"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fastapi-base-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP listener (no auth, no TLS)
      - "8025:8025" # Web UI + JSON HTTP API

  redis:
    image: redis:7-alpine
    container_name: fastapi-base-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-base-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # Endpoint
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "false"
      WORKERS: 2
      APP_NAME: FastAPI Base
      # Database (point at the postgres service on the compose network)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: fastapi_base
      # Email (MailHog)
      EMAIL_SMTP_HOST: mailhog
      EMAIL_SMTP_PORT: 1025
      EMAIL_SMTP_USE_TLS: "false"
      # RBAC — Casbin Redis watcher (REQUIRED when WORKERS > 1).
      # Each worker holds an in-memory enforcer; the watcher broadcasts
      # policy mutations across workers via Redis pub/sub.
      RBAC_WATCHER_REDIS_URL: redis://redis:6379/0
      # Rate limiting — share Redis (db index 1) so limits are
      # consistent across uvicorn workers.
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
      # Observability — requires compose.observability.yml profile running
      # so the otel-collector hostname resolves on the compose network.
      OBSERVABILITY_ENABLED: "true"
      OBSERVABILITY_OTLP_ENDPOINT: http://otel-collector:4317
      # Stable HTTP semconv → emits ``http.server.request.duration`` (seconds)
      # with the new label set, matching the provisioned Grafana dashboard.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
    ports:
      - "8000:8000"
    volumes:
      # Mount the RSA JWT keys from the host. Generate them with
      # ``uv run python scripts/generate_jwt_keys.py`` before starting.
      - ./keys:/app/keys:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  localstack:
    image: localstack/localstack:latest
    container_name: fastapi_base-localstack
    restart: always
    environment:
      - SERVICES=sqs,s3
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack
      - /Users/lhnguyen4748/.colima/default/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  localstack_data:
