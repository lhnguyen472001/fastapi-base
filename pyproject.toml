[project]
name = "fastapi-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "casbin>=1.43.0",
    "casbin-async-sqlalchemy-adapter>=1.17.0",
    "casbin-redis-watcher>=1.0.0",
    "dependency-injector>=4.49.0",
    "fastapi[standard]>=0.135.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "nh3>=0.3.5",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-exporter-otlp>=1.40.0",
    "opentelemetry-instrumentation>=0.61b0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-redis>=0.61b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.61b0",
    "opentelemetry-sdk>=1.40.0",
    "orjson>=3.11.8",
    "pydantic-settings>=2.13.1",
    "pyjwt[crypto]>=2.12.1",
    "pyotp>=2.9.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.48",
    "tenacity>=9.1.4",
    "uvicorn>=0.44.0",
    "zstandard>=0.23.0",
]

[project.scripts]
apps = "apps.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[dependency-groups]
dev = [
    "botocore-stubs>=1.42.41",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.22.0",
    "testcontainers[postgres]>=4.14.2",
    "types-aioboto3>=15.5.0",
    "types-aiobotocore[s3]>=3.5.0",
]

linter = [
    "mypy>=1.13.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests with no external dependencies",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["apps", "tests"]
extend-exclude = [
    ".venv",
    ".ruff_cache",
    "alembic/versions",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PL",     # pylint
    "PTH",    # flake8-use-pathlib
    "PIE",    # flake8-pie
    "RET",    # flake8-return (early return pattern)
    "TRY",    # tryceratops (exception handling)
    "DTZ",    # flake8-datetimez
    "G",      # flake8-logging-format
    "A",      # flake8-builtins
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "T20",    # flake8-print (forbid print())
    "Q",      # flake8-quotes
    "ERA",    # eradicate (no commented-out code)
]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "PLR0913", # too-many-arguments (FastAPI routes with many Depends)
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "TRY003",  # long exception messages (BackendError uses descriptive messages)
    "TRY300",  # consider moving to else block
    "RUF012",  # mutable class attributes (SQLAlchemy Mapped columns)
    "B008",    # function call in defaults (FastAPI Depends) — via extend-immutable-calls
    "ISC001",  # conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # allow assert
    "S105",    # hardcoded password in fixtures
    "S106",    # hardcoded password in fixtures
    "PLR2004", # magic values in tests
]
"alembic/**/*.py" = ["ALL"]
"apps/__main__.py" = ["T20"]
"scripts/**/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["apps"]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "dependency_injector.wiring.Provide",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy — static type checker
# https://mypy.readthedocs.io/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps"]
exclude = [
    "alembic/versions",
    ".venv",
    "tests",
]
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_any_unimported = false
disallow_untyped_decorators = false  # dependency_injector decorators are untyped

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "casbin.*",
    "casbin_async_sqlalchemy_adapter.*",
    "dependency_injector.*",
    "pyotp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

